name: Windows - DF Móveis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'supabase/functions/desktop-updates/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: df-windows-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Definir próxima versão
        run: node scripts/native-release.mjs version
      - run: npm test
      - name: Compilar instalador Windows
        run: npm run dist:win
      - name: Publicar canal de atualização automática
        run: node scripts/native-release.mjs publish
      - name: Verificar download de uma versão anterior
        run: node scripts/verify-native-update.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DF-Moveis-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
